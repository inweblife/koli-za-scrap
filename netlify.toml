[build]
  publish = "."

# Нашият sitemap: пренаписва всичко, което Netlify плъгин би генерирал
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-static.xml"
  status = 200
  force = true

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/za-men/*"
  to = "/about/"
  status = 301
  force = true
