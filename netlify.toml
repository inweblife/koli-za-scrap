[build]
  publish = "."

# Дублиращата версия на netlify.app -> основния домейн
[[redirects]]
  from = "https://postigni.netlify.app/*"
  to = "https://postigni.win/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://postigni.netlify.app/*"
  to = "https://postigni.win/:splat"
  status = 301
  force = true

# Нашият sitemap: пренаписва всичко, което Netlify плъгин би генерирал
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-static.xml"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/za-men/*"
  to = "/about/"
  status = 301
  force = true
